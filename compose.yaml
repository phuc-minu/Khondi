# Khondi local stack (T0004). Usage and ports: docs/infra/local-setup.md.
# Same images as Azure (P1); configuration only from .env (P2); published ports bind to
# 127.0.0.1 only, and KHONDI_*_PORT changes only the host side of each mapping.
name: khondi

services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (copy .env.example)}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${KHONDI_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty; creates the api's least-privilege role (T0005).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # Queue and cache only, so no persistence volume (T0002 open question 3).
    image: redis:7.4.12
    ports:
      - "127.0.0.1:${KHONDI_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # One-off job from the api image; the api itself never migrates (P6).
    build: ./backend
    platform: linux/amd64
    command: ["python", "-m", "khondi_api.migrate"]
    restart: "no"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env (copy .env.example)}
      MIGRATIONS_DATABASE_URL: ${MIGRATIONS_DATABASE_URL:?Set MIGRATIONS_DATABASE_URL in .env (copy .env.example)}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    platform: linux/amd64
    # Explicit list, not env_file: api and web read different PORT values.
    environment:
      PORT: ${PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env (copy .env.example)}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (copy .env.example)}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (copy .env.example)}
      DIAGNOSTICS_ENABLED: ${DIAGNOSTICS_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${KHONDI_API_PORT:-8000}:${PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; readiness covers PostgreSQL and Redis (P8).
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['PORT']}/readyz\", timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    # Same image as the api, different command (P1). No ports: it only talks to Redis.
    build: ./backend
    platform: linux/amd64
    command: ["python", "-m", "khondi_api.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env (copy .env.example)}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env (copy .env.example)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Passes while the worker's heartbeat key in Redis is fresh (P8).
      test: ["CMD", "python", "-m", "khondi_api.worker", "--check"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    # SIGTERM cancels running jobs and requeues them; the process exits well within this (P7).
    stop_grace_period: 10s

  web:
    build: ./frontend
    platform: linux/amd64
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env (copy .env.example)}
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${KHONDI_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch(`http://127.0.0.1:$${process.env.PORT}/api/healthz`).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Telemetry (T0007). No app waits for these: export runs in the background and a missing
  # collector loses telemetry, never a request or a job.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config", "/etc/khondi/collector.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/khondi/collector.yaml:ro
    ports:
      # For apps run natively on this computer; containers use otel-collector:4318.
      - "127.0.0.1:${KHONDI_OTLP_HTTP_PORT:-4318}:4318"

  lgtm:
    # Tempo, Loki and Grafana in one container. Local only: Azure uses Application Insights.
    image: grafana/otel-lgtm:0.41.1
    environment:
      # Grafana otherwise downloads grafana-llm-app on every start; nothing here uses it.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      # Grafana. It signs everyone in as admin, so it must stay on 127.0.0.1.
      - "127.0.0.1:${KHONDI_GRAFANA_PORT:-3001}:3000"
    volumes:
      - lgtm:/data
    healthcheck:
      # The image writes this file once Grafana, Tempo, Loki and its own collector answer.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  pgdata:
    name: khondi-pgdata
  lgtm:
    name: khondi-lgtm
