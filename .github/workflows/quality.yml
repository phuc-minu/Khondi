name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.apps.outputs.backend }}
      frontend: ${{ steps.apps.outputs.frontend }}
      e2e: ${{ steps.apps.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: apps
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "e2e=$([ -f frontend/playwright.config.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  diff-hygiene:
    # Blocks added lines that break Q4, Q6, Q8, Q9, Q14, and code changes without a handoff file.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_diff_hygiene.py "origin/${{ github.base_ref }}"

  repo-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9" "mypy==2.3.1" "pytest==9.1.1"
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: mypy --strict scripts
      - run: pytest -q scripts/tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    # Runs once backend/pyproject.toml exists. The backend must provide ruff, mypy, pytest
    # and pytest-cov as dev dependencies managed by uv.
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khondi
          POSTGRES_PASSWORD: khondi
          POSTGRES_DB: khondi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khondi" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://khondi:khondi@localhost:5432/khondi_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict .
      - run: uv run pytest --cov --cov-fail-under=85

  frontend:
    # Runs once frontend/package.json exists. The frontend must define the
    # lint, typecheck and test npm scripts (test runs Vitest once, not in watch mode).
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ENVIRONMENT: ci
      API_BASE_URL: http://api:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --platform linux/amd64 -t khondi-api backend
      - run: docker build --platform linux/amd64 -t khondi-web frontend
      - run: |
          docker run -d --name khondi-api -p 8000:8000 \
            -e ENVIRONMENT=ci \
            -e DATABASE_URL=postgresql://khondi:khondi@postgres:5432/khondi \
            -e REDIS_URL=redis://redis:6379/0 khondi-api
          test "$(docker inspect -f '{{.Config.User}}' khondi-api)" = "10001:10001"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
      - run: |
          docker run -d --name khondi-web -p 3000:3000 \
            -e ENVIRONMENT=ci -e API_BASE_URL=http://api:8000 khondi-web
          test "$(docker inspect -f '{{.Config.User}}' khondi-web)" = "10001:10001"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/api/healthz

  stack:
    # T0004-T0007: boot the Compose stack from a clean checkout; check health, migrations,
    # database privileges, data persistence, backup/restore, worker restarts and telemetry.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Ports bind to 127.0.0.1 only and images use exact tags
        run: |
          docker compose config --format json > compose.json
          jq -e '[.services[].ports[]? | .host_ip] | length > 0 and all(. == "127.0.0.1")' compose.json
          jq -e '[.services[] | select(.image) | .image] | all(test(":[0-9]+[.][0-9]+([.][0-9]+)?$"))' compose.json
      # Pulled first so the start-up timeout below measures start-up, not the 3.8 GB lgtm download.
      - run: docker compose pull --quiet --ignore-buildable
      - run: timeout 300 docker compose up --wait --build
      - name: Health and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          test "$(curl --fail --silent --show-error http://127.0.0.1:8000/readyz)" = '{"status":"ready"}'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/healthz
      - name: Migrations ran before the api and are idempotent (T0005)
        run: |
          test "$(docker compose ps --all --format '{{.ExitCode}}' migrate)" = "0"
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT version_num FROM alembic_version')" = "0001_baseline"
          docker compose run --rm migrate
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT count(*) FROM alembic_version')" = "1"
      - name: The api's database role cannot change the schema (T0005)
        run: |
          docker compose exec -T api python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  assert await connection.fetchval("SELECT current_user") == "khondi_app"
                  try:
                      await connection.execute("CREATE TABLE t0005_denied (v int)")
                  except asyncpg.InsufficientPrivilegeError:
                      return
                  raise SystemExit("khondi_app was able to create a table")
              finally:
                  await connection.close()


          asyncio.run(main())
          PY
      - name: Data survives down and up
        run: |
          docker compose exec -T postgres psql -U khondi -d khondi -v ON_ERROR_STOP=1             -c "CREATE TABLE t0004_persist (v text); INSERT INTO t0004_persist VALUES ('kept');"
          docker compose down
          timeout 300 docker compose up --wait
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT v FROM t0004_persist')" = "kept"
      - name: Backup and restore with pg_dump / pg_restore (T0005)
        run: |
          docker compose exec -T postgres pg_dump -Fc -U khondi khondi > khondi.dump
          docker compose exec -T postgres psql -U khondi -d khondi -v ON_ERROR_STOP=1 -c "DROP TABLE t0004_persist"
          docker compose exec -T postgres pg_restore --clean --if-exists -U khondi -d khondi < khondi.dump
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT v FROM t0004_persist')" = "kept"
      - name: A worker restart mid-job stops in time and reruns the job (T0006)
        run: |
          docker compose exec -T worker python - <<'PY'
          import asyncio
          import os

          from arq.connections import create_pool
          from pydantic import RedisDsn

          from khondi_api.worker import redis_settings

          TRACEPARENT = "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"


          async def main() -> None:
              pool = await create_pool(redis_settings(RedisDsn(os.environ["REDIS_URL"])))
              try:
                  job = await pool.enqueue_job("echo", "restart", TRACEPARENT, 8, _job_id="t0006-restart")
                  assert job is not None, "job was not queued"
              finally:
                  await pool.aclose()


          asyncio.run(main())
          PY
          sleep 2
          start=$(date +%s)
          docker compose stop worker
          elapsed=$(( $(date +%s) - start ))
          echo "worker stopped in ${elapsed}s, exit code $(docker compose ps --all --format '{{.ExitCode}}' worker)"
          test "$elapsed" -lt 10
          test "$(docker compose ps --all --format '{{.ExitCode}}' worker)" = "0"
          if docker compose run --rm --no-deps worker python -m khondi_api.worker --check; then
            echo "--check passed with the worker stopped"; exit 1
          fi
          timeout 120 docker compose up --wait worker
          docker compose exec -T worker python - <<'PY'
          import asyncio
          import os

          from arq.connections import create_pool
          from arq.jobs import Job
          from pydantic import RedisDsn

          from khondi_api.worker import redis_settings


          async def main() -> None:
              pool = await create_pool(redis_settings(RedisDsn(os.environ["REDIS_URL"])))
              try:
                  result = await Job("t0006-restart", pool).result(timeout=60)
                  print(result)
                  assert result.message == "restart"
                  assert result.job_try == 2, result.job_try
                  assert await pool.zscore("arq:queue", "t0006-restart") is None, "still queued"
              finally:
                  await pool.aclose()


          asyncio.run(main())
          PY
      - name: A job queued by the api carries the caller's trace ID to the worker (T0006)
        run: |
          traceparent="00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01"
          response=$(curl --fail --silent --show-error -X POST http://127.0.0.1:8000/v1/diagnostics/echo             -H "traceparent: $traceparent" -H "Content-Type: application/json" -d '{"message":"ci"}')
          echo "$response"
          job_id=$(echo "$response" | jq -r .job_id)
          for _ in $(seq 30); do
            result=$(curl --fail --silent --show-error "http://127.0.0.1:8000/v1/diagnostics/echo/$job_id")
            if [ "$(echo "$result" | jq -r .status)" = "complete" ]; then break; fi
            sleep 1
          done
          echo "$result"
          echo "$result" | jq -e '.status == "complete" and .result.trace_id == "0af7651916cd43dd8448eb211c80319c"'
      - name: One trace from web to worker reaches Tempo and Loki without content or credentials (T0007)
        env:
          TRACE_ID: 5bf92f3577b34da6a3ce929d0e0e4736
        run: |
          # The collector image has no shell; probe its health endpoint from the lgtm container.
          docker compose exec -T lgtm curl --fail --silent --show-error http://otel-collector:13133/
          # Through the web route, so the trace covers web, api and worker (T0002 AC 7).
          response=$(curl --fail --silent --show-error -X POST http://127.0.0.1:3000/api/diagnostics/echo             -H "traceparent: 00-$TRACE_ID-00f067aa0ba902b7-01" -H "Content-Type: application/json"             -d '{"message":"t0007-canary-content"}')
          job_id=$(echo "$response" | jq -r .job_id)
          for _ in $(seq 30); do
            result=$(curl --fail --silent --show-error "http://127.0.0.1:8000/v1/diagnostics/echo/$job_id")
            if [ "$(echo "$result" | jq -r .status)" = "complete" ]; then break; fi
            sleep 1
          done
          echo "$result" | jq -e '.status == "complete"'
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          GRAFANA = "http://127.0.0.1:3001/api/datasources/proxy/uid"
          TRACE_ID = os.environ["TRACE_ID"]
          # The canary message and every password in .env.example, raw or inside a URL.
          FORBIDDEN = ("t0007-canary-content", "khondi_app_local", ":khondi@")


          def get(url: str) -> str:
              with urllib.request.urlopen(url, timeout=10) as response:
                  return response.read().decode()


          def spans(body: str) -> dict[str, tuple[str, str, str, str]]:
              found = {}
              for resource in json.loads(body).get("trace", {}).get("resourceSpans", []):
                  attributes = {a["key"]: a["value"].get("stringValue") for a in resource["resource"]["attributes"]}
                  for scope in resource["scopeSpans"]:
                      for span in scope["spans"]:
                          parent = base64.b64decode(span.get("parentSpanId", "")).hex()
                          found[base64.b64decode(span["spanId"]).hex()] = (
                              attributes["service.name"], span["name"], span["kind"], parent
                          )
              return found


          trace_body, tree = "", {}
          for _ in range(60):
              try:
                  trace_body = get(f"{GRAFANA}/tempo/api/v2/traces/{TRACE_ID}")
                  tree = spans(trace_body)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              kinds = {(service, kind) for service, _, kind, _ in tree.values()}
              if {
                  ("khondi-web", "SPAN_KIND_SERVER"),
                  ("khondi-api", "SPAN_KIND_SERVER"),
                  ("khondi-worker", "SPAN_KIND_CONSUMER"),
              } <= kinds:
                  break
              time.sleep(1)
          for span_id, span in sorted(tree.items()):
              print(span_id, *span)
          (server,) = [i for i, s in tree.items() if s[0] == "khondi-api" and s[2] == "SPAN_KIND_SERVER"]
          (job,) = [i for i, s in tree.items() if s[0] == "khondi-worker" and s[1] == "job echo"]


          def ancestors(span_id: str) -> list[str]:
              chain = []
              while tree[span_id][3] in tree:
                  span_id = tree[span_id][3]
                  chain.append(span_id)
              return chain


          assert server in ancestors(job), "job echo is not a descendant of the api's server span"
          assert any(tree[i][0] == "khondi-web" for i in ancestors(server)), "the api's span has no khondi-web parent"

          query = f'{{service_name=~"khondi-api|khondi-worker"}} | trace_id="{TRACE_ID}"'
          log_url = f"{GRAFANA}/loki/loki/api/v1/query_range?" + urllib.parse.urlencode(
              {"query": query, "since": "15m", "limit": "100"}
          )
          for _ in range(30):
              log_body = get(log_url)
              services = {s["stream"]["service_name"] for s in json.loads(log_body)["data"]["result"]}
              if services == {"khondi-api", "khondi-worker"}:
                  break
              time.sleep(1)
          print("log streams from", sorted(services))
          assert services == {"khondi-api", "khondi-worker"}, services

          for text in FORBIDDEN:
              assert text not in trace_body and text not in log_body, f"{text!r} reached Tempo or Loki"
          PY
          # The web logs to stdout only; its request line carries the same trace ID.
          docker compose logs --no-log-prefix web | grep -F '"logger":"khondi_web.request"' | grep -F "\"trace_id\":\"$TRACE_ID\""
          if docker compose logs --no-log-prefix web | grep -F t0007-canary-content; then exit 1; fi
      - name: Requests and jobs still succeed with the collector stopped (T0007)
        run: |
          docker compose stop otel-collector
          code=$(curl --silent --show-error -o response.json -w '%{http_code}' -X POST             http://127.0.0.1:8000/v1/diagnostics/echo -H "Content-Type: application/json" -d '{"message":"ci"}')
          test "$code" = "202"
          job_id=$(jq -r .job_id response.json)
          for _ in $(seq 30); do
            result=$(curl --fail --silent --show-error "http://127.0.0.1:8000/v1/diagnostics/echo/$job_id")
            if [ "$(echo "$result" | jq -r .status)" = "complete" ]; then break; fi
            sleep 1
          done
          echo "$result" | jq -e '.status == "complete"'
          docker compose start otel-collector
      - if: failure()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  e2e:
    # Runs once frontend/playwright.config.ts exists. Uses recorded AI and provider responses.
    needs: [detect, frontend]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
