name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.apps.outputs.backend }}
      frontend: ${{ steps.apps.outputs.frontend }}
      e2e: ${{ steps.apps.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: apps
        run: |
          echo "backend=$([ -f backend/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "e2e=$([ -f frontend/playwright.config.ts ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  diff-hygiene:
    # Blocks added lines that break Q4, Q6, Q8, Q9, Q14, and code changes without a handoff file.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_diff_hygiene.py "origin/${{ github.base_ref }}"

  repo-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9" "mypy==2.3.1" "pytest==9.1.1"
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: mypy --strict scripts
      - run: pytest -q scripts/tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    # Runs once backend/pyproject.toml exists. The backend must provide ruff, mypy, pytest
    # and pytest-cov as dev dependencies managed by uv.
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: khondi
          POSTGRES_PASSWORD: khondi
          POSTGRES_DB: khondi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khondi" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://khondi:khondi@localhost:5432/khondi_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict .
      - run: uv run pytest --cov --cov-fail-under=85

  frontend:
    # Runs once frontend/package.json exists. The frontend must define the
    # lint, typecheck and test npm scripts (test runs Vitest once, not in watch mode).
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      ENVIRONMENT: ci
      API_BASE_URL: http://api:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --platform linux/amd64 -t khondi-api backend
      - run: docker build --platform linux/amd64 -t khondi-web frontend
      - run: |
          docker run -d --name khondi-api -p 8000:8000 \
            -e ENVIRONMENT=ci \
            -e DATABASE_URL=postgresql://khondi:khondi@postgres:5432/khondi \
            -e REDIS_URL=redis://redis:6379/0 khondi-api
          test "$(docker inspect -f '{{.Config.User}}' khondi-api)" = "10001:10001"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
      - run: |
          docker run -d --name khondi-web -p 3000:3000 \
            -e ENVIRONMENT=ci -e API_BASE_URL=http://api:8000 khondi-web
          test "$(docker inspect -f '{{.Config.User}}' khondi-web)" = "10001:10001"
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/api/healthz

  stack:
    # T0004-T0006: boot the Compose stack from a clean checkout; check health, migrations,
    # database privileges, data persistence, backup/restore and worker restarts.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Ports bind to 127.0.0.1 only and images use exact tags
        run: |
          docker compose config --format json > compose.json
          jq -e '[.services[].ports[]? | .host_ip] | length > 0 and all(. == "127.0.0.1")' compose.json
          jq -e '[.services[] | select(.image) | .image] | all(test(":[0-9]+[.][0-9]+([.][0-9]+)?$"))' compose.json
      - run: timeout 300 docker compose up --wait --build
      - name: Health and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          test "$(curl --fail --silent --show-error http://127.0.0.1:8000/readyz)" = '{"status":"ready"}'
          curl --fail --silent --show-error http://127.0.0.1:3000/api/healthz
      - name: Migrations ran before the api and are idempotent (T0005)
        run: |
          test "$(docker compose ps --all --format '{{.ExitCode}}' migrate)" = "0"
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT version_num FROM alembic_version')" = "0001_baseline"
          docker compose run --rm migrate
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT count(*) FROM alembic_version')" = "1"
      - name: The api's database role cannot change the schema (T0005)
        run: |
          docker compose exec -T api python - <<'PY'
          import asyncio
          import os

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              try:
                  assert await connection.fetchval("SELECT current_user") == "khondi_app"
                  try:
                      await connection.execute("CREATE TABLE t0005_denied (v int)")
                  except asyncpg.InsufficientPrivilegeError:
                      return
                  raise SystemExit("khondi_app was able to create a table")
              finally:
                  await connection.close()


          asyncio.run(main())
          PY
      - name: Data survives down and up
        run: |
          docker compose exec -T postgres psql -U khondi -d khondi -v ON_ERROR_STOP=1             -c "CREATE TABLE t0004_persist (v text); INSERT INTO t0004_persist VALUES ('kept');"
          docker compose down
          timeout 300 docker compose up --wait
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT v FROM t0004_persist')" = "kept"
      - name: Backup and restore with pg_dump / pg_restore (T0005)
        run: |
          docker compose exec -T postgres pg_dump -Fc -U khondi khondi > khondi.dump
          docker compose exec -T postgres psql -U khondi -d khondi -v ON_ERROR_STOP=1 -c "DROP TABLE t0004_persist"
          docker compose exec -T postgres pg_restore --clean --if-exists -U khondi -d khondi < khondi.dump
          test "$(docker compose exec -T postgres psql -U khondi -d khondi -tAc 'SELECT v FROM t0004_persist')" = "kept"
      - name: A worker restart mid-job stops in time and reruns the job (T0006)
        run: |
          docker compose exec -T worker python - <<'PY'
          import asyncio
          import os

          from arq.connections import create_pool
          from pydantic import RedisDsn

          from khondi_api.worker import redis_settings

          TRACEPARENT = "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"


          async def main() -> None:
              pool = await create_pool(redis_settings(RedisDsn(os.environ["REDIS_URL"])))
              try:
                  job = await pool.enqueue_job("echo", "restart", TRACEPARENT, 8, _job_id="t0006-restart")
                  assert job is not None, "job was not queued"
              finally:
                  await pool.aclose()


          asyncio.run(main())
          PY
          sleep 2
          start=$(date +%s)
          docker compose stop worker
          elapsed=$(( $(date +%s) - start ))
          echo "worker stopped in ${elapsed}s, exit code $(docker compose ps --all --format '{{.ExitCode}}' worker)"
          test "$elapsed" -lt 10
          test "$(docker compose ps --all --format '{{.ExitCode}}' worker)" = "0"
          if docker compose run --rm --no-deps worker python -m khondi_api.worker --check; then
            echo "--check passed with the worker stopped"; exit 1
          fi
          timeout 120 docker compose up --wait worker
          docker compose exec -T worker python - <<'PY'
          import asyncio
          import os

          from arq.connections import create_pool
          from arq.jobs import Job
          from pydantic import RedisDsn

          from khondi_api.worker import redis_settings


          async def main() -> None:
              pool = await create_pool(redis_settings(RedisDsn(os.environ["REDIS_URL"])))
              try:
                  result = await Job("t0006-restart", pool).result(timeout=60)
                  print(result)
                  assert result.message == "restart"
                  assert result.job_try == 2, result.job_try
                  assert await pool.zscore("arq:queue", "t0006-restart") is None, "still queued"
              finally:
                  await pool.aclose()


          asyncio.run(main())
          PY
      - if: failure()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  e2e:
    # Runs once frontend/playwright.config.ts exists. Uses recorded AI and provider responses.
    needs: [detect, frontend]
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
