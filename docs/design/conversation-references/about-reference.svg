<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Khondi About page concept — budget-first planning"><defs><linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f1eee7"/><stop offset=".52" stop-color="#dce8de"/><stop offset="1" stop-color="#c9dce0"/></linearGradient><linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fae9cd"/><stop offset=".55" stop-color="#a7cdd0"/><stop offset="1" stop-color="#65959f"/></linearGradient></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#fafaf7" stroke="none"/><rect x="0" y="0" width="1200" height="67" rx="0" fill="#ffffff" stroke="none"/><text x="58" y="43" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0b4846">◭ Khondi</text><text x="475" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">Home</text><text x="555" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">Trips</text><text x="635" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">How It Works</text><text x="775" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">About</text><rect x="1010" y="16" width="147" height="36" rx="9" fill="#065451" stroke="none"/><text x="1030" y="40" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Plan my trip</text><rect x="40" y="92" width="1120" height="250" rx="20" fill="url(#hero)" stroke="none"/><text x="76" y="138" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#086360">ABOUT KHONDI</text><text x="77" y="190" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#172b2f">Travel planning built</text><text x="77" y="243" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#172b2f">around real budgets</text><text x="79" y="286" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#3e555b">Your budget, your trip — practical travel planning from the first decision.</text><path d="M760 337 Q832 167 940 218 T1158 190 L1158 340Z" fill="#82a99c"/><path d="M774 337 Q914 269 1040 304 T1161 296 L1161 342Z" fill="#2d716d"/><text x="46" y="405" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#132d30">What makes Khondi different?</text><rect x="45" y="432" width="360" height="133" rx="16" fill="#ffffff" stroke="#d9e4e1"/><text x="65" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#103b3c">Budget-first</text><text x="65" y="492" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Start with what you can spend,</text><text x="65" y="516" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">not with endless search results.</text><rect x="420" y="432" width="360" height="133" rx="16" fill="#ffffff" stroke="#d9e4e1"/><text x="440" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#103b3c">Complete-trip clarity</text><text x="440" y="492" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">See itemized assumptions and</text><text x="440" y="516" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">the costs still to verify.</text><rect x="795" y="432" width="360" height="133" rx="16" fill="#ffffff" stroke="#d9e4e1"/><text x="815" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#103b3c">Practical itineraries</text><text x="815" y="492" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Understand daily plans, tradeoffs,</text><text x="815" y="516" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">and real-world constraints.</text><text x="51" y="632" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#085552">How it works:  1 · Set a budget     →     2 · Choose a destination     →     3 · Review your plan</text><text x="51" y="691" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#53676b">Sample trip prices are illustrative. Khondi does not claim confirmed bookability.</text><text x="52" y="742" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#6c7d80">KHONDI · Concept reference board, not a live website or verified travel quote</text></svg>