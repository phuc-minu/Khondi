<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Khondi budget-first user journey concept"><defs><linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f1eee7"/><stop offset=".52" stop-color="#dce8de"/><stop offset="1" stop-color="#c9dce0"/></linearGradient><linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fae9cd"/><stop offset=".55" stop-color="#a7cdd0"/><stop offset="1" stop-color="#65959f"/></linearGradient></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#fafaf7" stroke="none"/><rect x="0" y="0" width="1200" height="67" rx="0" fill="#ffffff" stroke="none"/><text x="58" y="43" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0b4846">◭ Khondi</text><text x="475" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">Home</text><text x="555" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">Trips</text><text x="635" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">How It Works</text><text x="775" y="42" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#162c32">About</text><rect x="1010" y="16" width="147" height="36" rx="9" fill="#065451" stroke="none"/><text x="1030" y="40" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Plan my trip</text><text x="68" y="148" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#163037">Your budget, your trip</text><text x="70" y="186" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#45616a">An uncluttered decision journey — one question at a time.</text><rect x="59" y="246" width="333" height="230" rx="16" fill="#ffffff" stroke="#d9e4e1"/><text x="79" y="277" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#103b3c">1 · What's your budget?</text><text x="79" y="306" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Total trip: $3,000</text><text x="79" y="330" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Travelers: 3</text><text x="79" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Duration: 4 days</text><text x="79" y="378" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Starting point: choose origin</text><rect x="434" y="246" width="333" height="230" rx="16" fill="#ffffff" stroke="#d9e4e1"/><text x="454" y="277" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#103b3c">2 · Where could you go?</text><text x="454" y="306" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Explore destinations fitting the</text><text x="454" y="330" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">budget and interests.</text><text x="454" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Show total estimates and tradeoffs.</text><text x="454" y="378" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Do not invent real-time prices.</text><rect x="808" y="246" width="333" height="230" rx="16" fill="#ffffff" stroke="#d9e4e1"/><text x="828" y="277" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#103b3c">3 · What will you do?</text><text x="828" y="306" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">View a day-by-day itinerary.</text><text x="828" y="330" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">See costs and assumptions.</text><text x="828" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Customize and save a draft.</text><text x="828" y="378" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#486267">Flag unknown or conflicting data.</text><text x="63" y="567" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#114e4e">Example destination: New Orleans</text><text x="64" y="602" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#52696d">Illustrative $3,000 budget · Costs and activities are mock data until connected to verified sources.</text><text x="52" y="742" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#6c7d80">KHONDI · Concept reference board, not a live website or verified travel quote</text></svg>