[project]
name = "khondi-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic==1.20.1", "asyncpg==0.30.0", "fastapi==0.115.6", "pydantic-settings==2.7.1", "redis==5.2.1", "sqlalchemy[asyncio]==2.1.9", "uvicorn[standard]==0.34.0"]

[dependency-groups]
dev = ["asyncpg-stubs==0.30.1", "httpx==0.28.1", "mypy==1.14.1", "pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khondi_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=khondi_api --cov-fail-under=85"
markers = ["integration: needs the real PostgreSQL and Redis services from the CI backend job"]
