[project]
name = "khondi-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["asyncpg==0.30.0", "fastapi==0.115.6", "pydantic-settings==2.7.1", "redis==5.2.1", "uvicorn[standard]==0.34.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==1.14.1", "pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=khondi_api --cov-fail-under=85"
